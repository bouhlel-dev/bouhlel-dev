<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3440"/>
      <stop offset="1" stop-color="#3b4252"/>
    </linearGradient>

    <g id="koi">
      <!-- tail -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-14 -30 0;14 -30 0;-14 -30 0" dur="1.2s" repeatCount="indefinite"/>
        <path d="M-30 0 C-45 -14 -62 -12 -68 -20 C-60 -6 -60 6 -68 20 C-62 12 -45 14 -30 0Z" fill="#d08770" opacity=".85"/>
      </g>
      <!-- fins -->
      <ellipse cx="14" cy="-13" rx="9" ry="4" fill="#d08770" opacity=".8" transform="rotate(-25 14 -13)"/>
      <ellipse cx="14" cy="13" rx="9" ry="4" fill="#d08770" opacity=".8" transform="rotate(25 14 13)"/>
      <!-- body -->
      <path d="M44 0 C32 -15 -10 -17 -32 -4 C-36 -2 -36 2 -32 4 C-10 17 32 15 44 0Z" fill="#eceff4"/>
      <!-- patches -->
      <path d="M20 -9 C8 -13 -6 -12 -12 -6 C-4 -2 10 -3 20 -9Z" fill="#d08770"/>
      <path d="M-8 4 C-16 8 -24 6 -28 2 C-22 0 -14 0 -8 4Z" fill="#bf616a"/>
      <circle cx="30" cy="-2" r="4" fill="#2e3440" opacity=".8"/>
      <!-- eyes -->
      <circle cx="36" cy="-7" r="2" fill="#2e3440"/>
      <circle cx="36" cy="7" r="2" fill="#2e3440"/>
    </g>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#water)"/>

  <!-- ripples -->
  <g fill="none" stroke="#88c0d0" stroke-width="1.5">
    <circle cx="200" cy="150" r="4">
      <animate attributeName="r" values="4;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="70" r="4">
      <animate attributeName="r" values="4;40" dur="5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- lily pads -->
  <g fill="#a3be8c">
    <path d="M120 60 a22 22 0 1 0 22 22 L120 82Z" opacity=".9"/>
    <path d="M760 150 a18 18 0 1 0 18 18 L760 168Z" opacity=".9"/>
  </g>
  <circle cx="132" cy="72" r="4" fill="#b48ead"/>

  <!-- koi 1 -->
  <g>
    <use href="#koi" xlink:href="#koi"/>
    <animateMotion dur="26s" repeatCount="indefinite" rotate="auto"
      path="M450 40 C700 40 850 90 850 110 C850 150 700 190 450 180 C200 190 50 150 50 110 C50 70 200 40 450 40Z"/>
  </g>

  <!-- koi 2 (smaller, opposite side of the pond) -->
  <g>
    <g transform="scale(.7)"><use href="#koi" xlink:href="#koi"/></g>
    <animateMotion dur="32s" begin="-16s" repeatCount="indefinite" rotate="auto"
      path="M450 40 C700 40 850 90 850 110 C850 150 700 190 450 180 C200 190 50 150 50 110 C50 70 200 40 450 40Z"/>
  </g>
</svg>
